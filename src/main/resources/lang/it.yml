  header: "&6ItemBlocker &7{version} &8- &7comandi"
  block: "&e/{label} block &f<oggetto> &8- &7bloccare un oggetto"
  block-enchantment: "&e/{label} block enchantment &f<nome> &8- &7bloccare un incantesimo"
  block-potion: "&e/{label} block potion &f<effetto> &8- &7bloccare un effetto"
