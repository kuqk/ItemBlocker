  filter: "&e/{label} filter &f<add|remove|list> &8- &7filtrare oggetti"
  group: "&e/{label} group &f<add|remove|list> &8- &7bloccare gruppi"
  allow: "&e/{label} allow &f<add|remove|list> &8- &7oggetti consentiti"
  scan: "&e/{label} scan &f<players|containers> &8- &7trovare oggetti vietati"
  confiscated: "&e/{label} confiscated &f[take] &8- &7oggetti confiscati"
  log: "&e/{label} log &f[player] &8- &7blocchi recenti"
