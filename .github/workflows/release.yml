name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read version from pom.xml
        id: version
        shell: bash
        run: |
          VERSION="$(bash ./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog_path = Path("CHANGELOG.md")
          fallback = f"See CHANGELOG.md for ItemBlocker {version}."

          if not changelog_path.exists():
            notes = fallback
          else:
            lines = changelog_path.read_text(encoding="utf-8").splitlines()
            header = f"## [{version}]"
            start = next((i for i, line in enumerate(lines) if line.startswith(header)), None)
            if start is None:
              notes = fallback
            else:
              end = len(lines)
              for i in range(start + 1, len(lines)):
                if lines[i].startswith("## ["):
                  end = i
                  break
              notes = "\n".join(lines[start:end]).strip() or fallback

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("body<<EOF\n")
            fh.write(notes + "\n")
            fh.write("EOF\n")
          PY

      - name: Check if GitHub release already exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        if: steps.release.outputs.exists != 'true'
        run: bash ./mvnw -B -ntp clean package

      - name: Update existing GitHub release notes
        if: steps.release.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release edit "$TAG" --notes-file release-notes.md

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            "target/ItemBlocker-${{ steps.version.outputs.version }}.jar" \
            --title "ItemBlocker v${{ steps.version.outputs.version }}" \
            --target "${GITHUB_SHA}" \
            --notes-file release-notes.md
