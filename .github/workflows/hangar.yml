name: Publish Hangar

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      HANGAR_SLUG: ${{ vars.HANGAR_SLUG }}
      HANGAR_CHANNEL: ${{ vars.HANGAR_CHANNEL }}
      HANGAR_PLATFORM_DEPENDENCIES: ${{ vars.HANGAR_PLATFORM_DEPENDENCIES }}
      HANGAR_PLUGIN_DEPENDENCIES: ${{ vars.HANGAR_PLUGIN_DEPENDENCIES }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read version from pom.xml
        id: version
        shell: bash
        run: |
          VERSION="$(bash ./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          MC_LATEST="$(bash ./mvnw -q -DforceStdout help:evaluate -Dexpression=minecraft.latest.version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_latest=$MC_LATEST" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog_path = Path("CHANGELOG.md")
          fallback = f"See CHANGELOG.md for ItemBlocker {version}."

          if not changelog_path.exists():
            notes = fallback
          else:
            lines = changelog_path.read_text(encoding="utf-8").splitlines()
            header = f"## [{version}]"
            start = next((i for i, line in enumerate(lines) if line.startswith(header)), None)
            if start is None:
              notes = fallback
            else:
              end = len(lines)
              for i in range(start + 1, len(lines)):
                if lines[i].startswith("## ["):
                  end = i
                  break
              notes = "\n".join(lines[start:end]).strip() or fallback

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("body<<EOF\n")
            fh.write(notes + "\n")
            fh.write("EOF\n")
          PY

      - name: Read GitHub release data
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG was not found. Run the Release workflow first or create the release manually."
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "body<<EOF"
            gh release view "$TAG" --json body --jq '.body'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Hangar configuration
        shell: bash
        run: |
          if [ -z "${HANGAR_API_TOKEN}" ]; then
            echo "::error::Missing repository secret HANGAR_API_TOKEN. Set it in Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

          if [ -z "${HANGAR_SLUG}" ]; then
            echo "::notice::HANGAR_SLUG is not set. Workflow will use repository name as slug: ${GITHUB_REPOSITORY#*/}."
          fi

          if [ -z "${HANGAR_CHANNEL}" ]; then
            echo "::notice::HANGAR_CHANNEL is not set. Workflow will use default channel: Release."
          fi

          if [ -z "${HANGAR_PLATFORM_DEPENDENCIES}" ]; then
            echo "::notice::HANGAR_PLATFORM_DEPENDENCIES is not set. Workflow will list every Paper release from plugin.yml api-version up to minecraft.latest.version (${{ steps.version.outputs.mc_latest }})."
          fi

          if [ -z "${HANGAR_PLUGIN_DEPENDENCIES}" ]; then
            echo "::notice::HANGAR_PLUGIN_DEPENDENCIES is not set. Workflow will publish without extra plugin dependencies."
          fi

      - name: Resolve Hangar metadata
        id: metadata
        shell: bash
        env:
          MC_LATEST: ${{ steps.version.outputs.mc_latest }}
        run: |
          PLUGIN_YML="src/main/resources/plugin.yml"

          SLUG="${HANGAR_SLUG:-${GITHUB_REPOSITORY#*/}}"
          CHANNEL="${HANGAR_CHANNEL:-Release}"
          PLATFORM_DEPENDENCIES="${HANGAR_PLATFORM_DEPENDENCIES}"
          PLUGIN_DEPENDENCIES="${HANGAR_PLUGIN_DEPENDENCIES}"

          if [ -z "${PLUGIN_DEPENDENCIES}" ]; then
            PLUGIN_DEPENDENCIES='{}'
          fi

          if [ -z "${PLATFORM_DEPENDENCIES}" ] && [ -f "${PLUGIN_YML}" ]; then
            API_VERSION="$(sed -nE 's/^api-version:[[:space:]]*"?([^"]*)"?$/\1/p' "${PLUGIN_YML}" | head -n 1)"
            if [ -n "${API_VERSION}" ] && [ -n "${MC_LATEST}" ]; then
              PAPER_RESPONSE="$(curl --silent --show-error --fail https://fill.papermc.io/v3/projects/paper || true)"
              if [ -n "${PAPER_RESPONSE}" ]; then
                # Every stable Paper version between api-version and minecraft.latest.version (inclusive).
                PAPER_VERSIONS="$(echo "${PAPER_RESPONSE}" | jq -c --arg min "${API_VERSION}" --arg max "${MC_LATEST}" '
                  def numeric: split(".") | map(tonumber);
                  [.versions[][] | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))]
                  | map(select(numeric >= ($min | numeric) and numeric <= ($max | numeric)))
                  | unique
                ')"
                if [ -n "${PAPER_VERSIONS}" ] && [ "${PAPER_VERSIONS}" != "[]" ]; then
                  PLATFORM_DEPENDENCIES="$(jq -cn --argjson versions "${PAPER_VERSIONS}" '{PAPER: $versions}')"
                fi
              fi
            fi
          fi

          if [ -z "${PLATFORM_DEPENDENCIES}" ]; then
            echo "::warning::Could not resolve Paper versions from fill.papermc.io. Using the built-in fallback list."
            PLATFORM_DEPENDENCIES='{"PAPER":["1.21","1.21.1","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11","26.1.1","26.1.2","26.2","26.3"]}'
          fi

          if ! echo "${PLATFORM_DEPENDENCIES}" | jq -e . >/dev/null 2>&1; then
            echo "::error::Resolved Hangar platform_dependencies is not valid JSON."
            echo "::group::Invalid platform_dependencies"
            echo "${PLATFORM_DEPENDENCIES}"
            echo "::endgroup::"
            exit 1
          fi

          if ! echo "${PLUGIN_DEPENDENCIES}" | jq -e . >/dev/null 2>&1; then
            echo "::error::Resolved Hangar plugin_dependencies is not valid JSON."
            echo "::group::Invalid plugin_dependencies"
            echo "${PLUGIN_DEPENDENCIES}"
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice::Resolved Hangar slug: ${SLUG}"
          echo "::notice::Resolved Hangar channel: ${CHANNEL}"
          echo "::group::Resolved Hangar platform_dependencies"
          echo "${PLATFORM_DEPENDENCIES}"
          echo "::endgroup::"

          {
            echo "slug=${SLUG}"
            echo "channel=${CHANNEL}"
            echo "platform_dependencies<<EOF"
            echo "${PLATFORM_DEPENDENCIES}"
            echo "EOF"
            echo "plugin_dependencies<<EOF"
            echo "${PLUGIN_DEPENDENCIES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Hangar version state
        id: version_state
        shell: bash
        env:
          HANGAR_OWNER: ${{ github.repository_owner }}
          HANGAR_SLUG_RESOLVED: ${{ steps.metadata.outputs.slug }}
          HANGAR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSIONS_RESPONSE="$(curl --silent --show-error "https://hangar.papermc.io/api/v1/projects/${HANGAR_OWNER}/${HANGAR_SLUG_RESOLVED}/versions")"

          if ! echo "${VERSIONS_RESPONSE}" | jq -e '.result | type == "array"' >/dev/null 2>&1; then
            echo "::error::Could not read existing Hangar versions for ${HANGAR_OWNER}/${HANGAR_SLUG_RESOLVED}."
            echo "::group::Hangar versions lookup response"
            echo "${VERSIONS_RESPONSE}"
            echo "::endgroup::"
            exit 1
          fi

          if echo "${VERSIONS_RESPONSE}" | jq -e --arg version "${HANGAR_VERSION}" '.result[] | select(.name == $version)' >/dev/null 2>&1; then
            echo "::notice::Hangar version ${HANGAR_VERSION} already exists. Upload will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        run: bash ./mvnw -B -ntp clean package

      # Uploads straight to the Hangar API. milkdrinkers/Hangar-Publish only matches Paper versions
      # that Hangar lists as sub-versions, so it silently dropped 26.2 and 26.3 from 1.2.0.
      # Hangar uploads this plugin under PAPER platform metadata.
      # The same jar is still intended to run on Folia, Paper, Purpur and Spigot.
      - name: Publish release to Hangar
        if: steps.version_state.outputs.exists != 'true'
        shell: bash
        env:
          HANGAR_SLUG_RESOLVED: ${{ steps.metadata.outputs.slug }}
          HANGAR_CHANNEL_RESOLVED: ${{ steps.metadata.outputs.channel }}
          HANGAR_VERSION: ${{ steps.version.outputs.version }}
          HANGAR_DESCRIPTION: ${{ steps.notes.outputs.body }}
          HANGAR_PLATFORM_DEPENDENCIES_RESOLVED: ${{ steps.metadata.outputs.platform_dependencies }}
          HANGAR_PLUGIN_DEPENDENCIES_RESOLVED: ${{ steps.metadata.outputs.plugin_dependencies }}
        run: |
          JAR="target/ItemBlocker-${HANGAR_VERSION}.jar"
          USER_AGENT="ItemBlocker-release; ${HANGAR_SLUG_RESOLVED}"

          TOKEN="$(curl --silent --show-error --fail -X POST -G \
            -H "User-Agent: ${USER_AGENT}" \
            --data-urlencode "apiKey=${HANGAR_API_TOKEN}" \
            "https://hangar.papermc.io/api/v1/authenticate" | jq -r '.token // empty')"
          if [ -z "${TOKEN}" ]; then
            echo "::error::Hangar authentication failed. Check the HANGAR_API_TOKEN secret."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"

          jq -n \
            --arg version "${HANGAR_VERSION}" \
            --arg channel "${HANGAR_CHANNEL_RESOLVED}" \
            --arg description "${HANGAR_DESCRIPTION}" \
            --argjson platformDependencies "${HANGAR_PLATFORM_DEPENDENCIES_RESOLVED}" \
            --argjson pluginDependencies "${HANGAR_PLUGIN_DEPENDENCIES_RESOLVED}" \
            '{
              version: $version,
              channel: $channel,
              description: $description,
              files: [{platforms: ["PAPER"]}],
              platformDependencies: $platformDependencies,
              pluginDependencies: $pluginDependencies
            }' > hangar-version.json

          echo "::group::Hangar version payload"
          jq 'del(.description)' hangar-version.json
          echo "::endgroup::"

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --output "${RESPONSE_FILE}" --write-out "%{http_code}" \
            -X POST "https://hangar.papermc.io/api/v1/projects/${HANGAR_SLUG_RESOLVED}/upload" \
            -H "User-Agent: ${USER_AGENT}" \
            -H "Authorization: ${TOKEN}" \
            -F "versionUpload=@hangar-version.json;type=application/json" \
            -F "files=@${JAR};type=application/x-binary")"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Hangar upload failed with HTTP ${HTTP_CODE}."
            echo "::group::Hangar response body"
            cat "${RESPONSE_FILE}"
            echo
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice::Published Hangar version: $(jq -r '.url // "unknown url"' "${RESPONSE_FILE}")"
