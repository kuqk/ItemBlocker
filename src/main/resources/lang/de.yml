  items-header: "&6Blockierte Items in &e{preset}"
  item-entry: " &8• &f{item}&7: &f{actions} &7(Welten: &f{worlds}&7)"
  limits-header: "&6Item-Limits in &e{preset}"
  limit-entry: " &8• &f{item}&7: Stapel &f{stack}&7, Inventar &f{inventory}"
  filters-header: "&6Item-Filter in &e{preset}"
  filter-entry: " &8• &e{filter}&7: &f{match} &8- &f{actions} &7in &f{worlds}"
  enchantments-header: "&6Blockierte Verzauberungen in &e{preset}"
  potions-header: "&6Blockierte Trankeffekte in &e{preset}"
  level-entry: " &8• &f{name}&7: ab Stufe &f{level}"
  empty: " &7Hier ist nichts."

presets:
  header: "&6Presets"
  entry: " &8• &e{preset}&7: {description}"
  no-description: "&8keine Beschreibung"
  details-header: "&6Preset &e{preset}"
  details-description: " &7Beschreibung: &f{description}"
  details-reason: " &7Grund: &f{reason}"
  details-worlds: " &7Welten: &f{worlds}"
  details-regions: " &7Regionen: &f{regions}"
  details-counts: " &7Regeln: &f{items} &7Items, &f{enchantments} &7Verzauberungen, &f{potions} &7Trankeffekte"

reloaded: "{prefix}&aKonfiguration, Regeln und Nachrichten wurden neu geladen."

