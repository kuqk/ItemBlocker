  dispense: "{prefix}&cDispensery nie mogą używać &f{item}&c.{reason}"
  brew: "{prefix}&cNie możesz warzyć &f{item}&c.{reason}"
  trade: "{prefix}&cNie możesz wymieniać się na &f{item}&c.{reason}"
