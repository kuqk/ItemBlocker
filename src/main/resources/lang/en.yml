help:
  header: "&6ItemBlocker &7{version} &8- &7commands"
  block: "&e/{label} block &f<item> &8- &7block an item"
  block-enchantment: "&e/{label} block enchantment &f<name> &8- &7block an enchantment"
  block-potion: "&e/{label} block potion &f<effect> &8- &7block an effect"
  edit: "&e/{label} edit &f<item> &8- &7change an item rule"
  limit: "&e/{label} limit &f<item> &8- &7stack and inventory limits"
  filter: "&e/{label} filter &f<add|remove|list> &8- &7filter specific items"
  group: "&e/{label} group &f<add|remove|list> &8- &7block item groups"
  allow: "&e/{label} allow &f<add|remove|list> &8- &7allowed items"
  scan: "&e/{label} scan &f<players|containers> &8- &7find forbidden items"
  confiscated: "&e/{label} confiscated &f[take] &8- &7confiscated items"
  log: "&e/{label} log &f[player] &8- &7recent blocked actions"
  unblock: "&e/{label} unblock &f<item> &8- &7remove a rule"
  show: "&e/{label} show &f<item> &8- &7show the rules"
  list: "&e/{label} list &f[kind] &8- &7list rules"
  preset: "&e/{label} preset &f<action> &8- &7manage presets"
  gui: "&e/{label} gui &8- &7open the menu"
  reload: "&e/{label} reload &8- &7reload the files"
  options: "&7Options: &factions: worlds: in: stack: inventory: level:"
  options-hint: "&fhand &7= item in your hand, &fTAB &7completes the rest"
