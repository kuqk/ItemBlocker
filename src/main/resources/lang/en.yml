  prompt-cancelled: "{prefix}&7Cancelled."
  what-preset-name: "the name of the new preset"
  what-description: "the description"
  what-reason: "the reason shown to players"
  what-worlds: "worlds separated by commas, or all"
  what-regions: "WorldGuard regions separated by commas, or all"
  what-pattern: "a pattern such as *_sword or #swords"
  what-filter-id: "an id for the filter, such as excalibur"
  what-permission: "a permission, or none"
  what-value: "the new value, or none"
  section-items: "&eItems"
  section-groups: "&eItem groups"
  section-filters: "&eItem filters"
  section-allowed: "&eAllowed items"
  section-enchantments: "&eEnchantments"
  section-effects: "&ePotion effects"
  section-settings: "&eSettings"
  section-lore: "&7Entries: &f{count}\n\n&eClick to open"
  delete-name: "&cDelete preset"
  delete-lore: "&7Shift + right click to delete\n&7this preset and all its rules"
  items-title: "Items in {preset}"
  groups-title: "Groups in {preset}"
  filters-title: "Filters in {preset}"
  allowed-title: "Allowed in {preset}"
  enchantments-title: "Enchantments in {preset}"
  effects-title: "Effects in {preset}"
  settings-title: "Settings of {preset}"
  group-title: "Group {group}"
  filter-title: "Filter {filter}"
  add-group-name: "&aAdd a group"
  add-group-lore: "&7Click and type a pattern\n&7such as *_sword or #swords"
  add-filter-lore: "&7Click an item in your inventory\n&7to make a filter from it"
  add-allowed-lore: "&7Click an item in your inventory\n&7to allow it in this preset"
  group-lore: "&7Blocked: &f{actions}\n&7Worlds: &f{worlds}\n\n&eClick to edit\n&eShift + right click to remove"
  filter-lore: "&7Matches: &f{match}\n&7Blocked: &f{actions}\n&7Worlds: &f{worlds}\n\n&eClick to edit\n&eShift + right click to remove"
