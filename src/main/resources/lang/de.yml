  enchantment-header: "&6{enchantment} &8- &7Regeln"
  potion-header: "&6{effect} &8- &7Regeln"
  level-entry: " &8• &e{preset}&7: ab Stufe &f{level} &7(Welten: &f{worlds}&7)"
  level-empty: " &7Kein Preset blockiert das."

