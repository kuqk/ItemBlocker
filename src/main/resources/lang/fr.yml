# Messages d'ItemBlocker (français)
# Couleurs : &a, &c, ... et couleurs hex comme &#ff8800. Les variables s'écrivent {nom}.
# Les entrées manquantes utilisent le texte fourni, il suffit donc de garder celles que tu modifies.

prefix: "&8[&5ItemBlocker&8]&r "

restriction:
  crafting: "{prefix}&cTu ne peux pas fabriquer &f{item}&c.{reason}"
  pickup: "{prefix}&cTu ne peux pas ramasser &f{item}&c.{reason}"
  drop: "{prefix}&cTu ne peux pas jeter &f{item}&c.{reason}"
  use: "{prefix}&cTu ne peux pas utiliser &f{item}&c.{reason}"
  place: "{prefix}&cTu ne peux pas placer &f{item}&c.{reason}"
  armor: "{prefix}&cTu ne peux pas équiper &f{item}&c.{reason}"
  inventory: "{prefix}&cTu ne peux pas déplacer &f{item}&c dans les conteneurs.{reason}"
  hopper: "{prefix}&cLes entonnoirs ne peuvent pas déplacer &f{item}&c.{reason}"
  smithing: "{prefix}&cTu ne peux pas forger &f{item}&c à la table de forgeron.{reason}"
  enchanted-item: "{prefix}&f{item} &cporte l'enchantement bloqué &f{enchantment} {level}&c.{reason}"
  enchanting: "{prefix}&cTu ne peux pas enchanter avec &f{enchantment} {level}&c.{reason}"
  stack-limit: "{prefix}&f{item} &cs'empile ici jusqu'à &f{limit} &cmaximum.{reason}"
  inventory-limit: "{prefix}&cTu peux porter au maximum &f{limit} {item}&c.{reason}"
  potion: "{prefix}&cL'effet &f{effect} {level} &cest bloqué.{reason}"
  reason: " &7({reason}&7)"

word:
  all-actions: "toutes les actions"
  no-actions: "aucune action"
  all-worlds: "tous les mondes"
  all-regions: "toutes les régions"
  none: "aucun"
  no-limit: "aucune limite"

error:
  no-permission: "{prefix}&cTu n'as pas la permission de faire ça."
  players-only: "{prefix}&cSeuls les joueurs peuvent faire ça."
  unknown-command: "{prefix}&cCommande inconnue. Utilise &f/{label} help&c."
  usage: "{prefix}&cUtilisation : &f/{label} {usage}"
  unknown-item: "{prefix}&cObjet inconnu : &f{input}&c."
  unknown-enchantment: "{prefix}&cEnchantement inconnu : &f{input}&c."
  unknown-potion: "{prefix}&cEffet de potion inconnu : &f{input}&c."
  unknown-action: "{prefix}&cAction inconnue : &f{input}&c. Disponibles : &f{actions}&c."
  unknown-option: "{prefix}&cOption inconnue : &f{input}&c."
  invalid-level: "{prefix}&cLe niveau doit être un nombre entier à partir de 1, pas &f{input}&c."
  invalid-limit: "{prefix}&cUne limite doit être un nombre entier à partir de 1 ou none, reçu &f{input}&c."
  invalid-model: "{prefix}&cLe custom model data doit être un nombre entier, reçu &f{input}&c."
  empty-hand: "{prefix}&cTiens un objet dans ta main principale."
  unknown-preset: "{prefix}&cLe preset &f{preset} &cn'existe pas."
  save-failed: "{prefix}&cImpossible d'enregistrer les règles : &f{error}"
  reload-failed: "{prefix}&cImpossible de recharger : &f{error}&c. Les règles précédentes restent actives."

item:
  blocked: "{prefix}&f{item} &aest bloqué dans &e{preset}&a : &f{actions} &7dans &f{worlds}&a."
  updated: "{prefix}&f{item} &aa été modifié dans &e{preset}&a : &f{actions} &7dans &f{worlds}&a."
  unblocked: "{prefix}&f{item} &an'est plus bloqué dans &e{preset}&a."
  not-blocked: "{prefix}&f{item} &7n'est pas bloqué dans &e{preset}&7."

limit:
  set: "{prefix}&aLimites de &f{item} &adans &e{preset}&a : pile &f{stack}&a, inventaire &f{inventory}&a."
  removed: "{prefix}&aLimites de &f{item} &asupprimées dans &e{preset}&a."

filter:
  saved: "{prefix}&aFiltre &e{filter} &aenregistré dans &e{preset}&a : &f{match}&a, bloque &f{actions} &7dans &f{worlds}&a."
  removed: "{prefix}&aFiltre &e{filter} &aretiré de &e{preset}&a."
  unknown: "{prefix}&cLe preset &e{preset} &cn'a pas de filtre &f{filter}&c."
  invalid-id: "{prefix}&cID de filtre invalide &f{filter}&c. Utilise 1 à 32 caractères : a-z, 0-9, _ ou -."
  empty: "{prefix}&cUn filtre a besoin d'au moins un de hand, type:, name:, lore:, model:, data: ou enchantment:."

group:
  saved: "{prefix}&aGroupe &e{group} &aenregistré dans &e{preset}&a : bloque &f{actions} &7dans &f{worlds}&a."
  removed: "{prefix}&aGroupe &e{group} &aretiré de &e{preset}&a."
  unknown: "{prefix}&cLe preset &e{preset} &cn'a pas de groupe &f{group}&c."
  invalid: "{prefix}&cMotif invalide &f{group}&c. Utilise * comme joker, comme *_sword, ou un tag comme #swords."

allow:
  added: "{prefix}&f{item} &aest autorisé dans &e{preset}&a."
  removed: "{prefix}&f{item} &an'est plus autorisé dans &e{preset}&a."
  unknown: "{prefix}&f{item} &cn'est pas dans la liste autorisée de &e{preset}&c."

enchantment:
  blocked: "{prefix}&f{enchantment} &aest bloqué à partir du niveau &f{level} &adans &e{preset}&a."
  unblocked: "{prefix}&f{enchantment} &an'est plus bloqué dans &e{preset}&a."
  not-blocked: "{prefix}&f{enchantment} &7n'est pas bloqué dans &e{preset}&7."

potion:
  blocked: "{prefix}&f{effect} &aest bloqué à partir du niveau &f{level} &adans &e{preset}&a."
  unblocked: "{prefix}&f{effect} &an'est plus bloqué dans &e{preset}&a."
  not-blocked: "{prefix}&f{effect} &7n'est pas bloqué dans &e{preset}&7."

preset:
  created: "{prefix}&aLe preset &e{preset} &aa été créé."
  deleted: "{prefix}&aLe preset &e{preset} &aa été supprimé."
  exists: "{prefix}&cLe preset &e{preset} &cexiste déjà."
  invalid-name: "{prefix}&cNom de preset invalide : &f{preset}&c. Utilise 1 à 32 caractères : a-z, 0-9, _ ou -."
  default-protected: "{prefix}&cLe preset default ne peut pas être supprimé."
  description-set: "{prefix}&aLa description de &e{preset} &aa été modifiée."
  reason-set: "{prefix}&aLa raison de &e{preset} &aa été modifiée."
  worlds-set: "{prefix}&aLe preset &e{preset} &as'applique maintenant dans &f{worlds}&a."
  regions-set: "{prefix}&aRégions de &e{preset}&a : &f{regions}&a."
  regions-unavailable: "{prefix}&eWorldGuard n'est pas installé, ce preset ne s'applique donc nulle part tant qu'il ne l'est pas."

show:
  item-header: "&6{item} &8- &7règles"
  item-entry: " &8• &e{preset}&7 : &f{actions} &7dans &f{worlds}"
  item-empty: " &7Aucun preset ne bloque &f{item}&7."
  limit-entry: " &8• &e{preset}&7 : pile &f{stack}&7, inventaire &f{inventory}"
  filter-entry: " &8• &e{preset}&7 : filtre &e{filter}&7, &f{actions} &7dans &f{worlds}"
  enchantment-header: "&6{enchantment} &8- &7règles"
  potion-header: "&6{effect} &8- &7règles"
  level-entry: " &8• &e{preset}&7 : à partir du niveau &f{level} &7dans &f{worlds}"
  level-empty: " &7Aucun preset ne le bloque."

list:
  header: "&6Règles d'ItemBlocker"
  preset-entry: " &8• &e{preset}&7 : &f{items} &7objets, &f{enchantments} &7enchantements, &f{potions} &7effets de potion &8(&7{worlds}&8)"
  items-header: "&6Objets bloqués dans &e{preset}"
  item-entry: " &8• &f{item}&7 : &f{actions} &7dans &f{worlds}"
  limits-header: "&6Limites d'objets dans &e{preset}"
  limit-entry: " &8• &f{item}&7 : pile &f{stack}&7, inventaire &f{inventory}"
  filters-header: "&6Filtres d'objets dans &e{preset}"
  filter-entry: " &8• &e{filter}&7 : &f{match} &8- &f{actions} &7dans &f{worlds}"
  groups-header: "&6Groupes d'objets dans &e{preset}"
  group-entry: " &8• &e{group}&7 : &f{actions} &7dans &f{worlds}"
  allowed-header: "&6Objets autorisés dans &e{preset}"
  allowed-entry: " &8• &f{item}"
  enchantments-header: "&6Enchantements bloqués dans &e{preset}"
  potions-header: "&6Effets de potion bloqués dans &e{preset}"
  level-entry: " &8• &f{name}&7 : à partir du niveau &f{level}"
  empty: " &7Rien ici."

presets:
  header: "&6Presets"
  entry: " &8• &e{preset}&7 : {description}"
  no-description: "&8aucune description"
  details-header: "&6Preset &e{preset}"
  details-description: " &7Description : &f{description}"
  details-reason: " &7Raison : &f{reason}"
  details-worlds: " &7Mondes : &f{worlds}"
  details-regions: " &7Régions : &f{regions}"
  details-counts: " &7Règles : &f{items} &7objets, &f{enchantments} &7enchantements, &f{potions} &7effets de potion"

reloaded: "{prefix}&aLa configuration, les règles et les messages ont été rechargés."

