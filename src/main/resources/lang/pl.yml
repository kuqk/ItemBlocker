  removed: "{prefix}&aUsunięto limity dla &f{item} &aw &e{preset}&a."

filter:
  saved: "{prefix}&aZapisano filtr &e{filter} &aw &e{preset}&a: &f{match}&a, blokuje &f{actions} &7w &f{worlds}&a."
  removed: "{prefix}&aUsunięto filtr &e{filter} &az &e{preset}&a."
