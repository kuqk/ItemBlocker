# ItemBlocker-Nachrichten (Deutsch)
# Farben: &a, &c, ... und Hex-Farben wie &#ff8800. Platzhalter werden als {name} geschrieben.
# Fehlende Einträge nutzen den mitgelieferten Text, du musst also nur deine Änderungen behalten.

prefix: "&8[&5ItemBlocker&8]&r "

restriction:
  crafting: "{prefix}&cDu kannst &f{item} &cnicht herstellen.{reason}"
  pickup: "{prefix}&cDu kannst &f{item} &cnicht aufheben.{reason}"
  drop: "{prefix}&cDu kannst &f{item} &cnicht fallen lassen.{reason}"
  use: "{prefix}&cDu kannst &f{item} &cnicht benutzen.{reason}"
  place: "{prefix}&cDu kannst &f{item} &cnicht platzieren.{reason}"
  armor: "{prefix}&cDu kannst &f{item} &cnicht anlegen.{reason}"
  inventory: "{prefix}&cDu kannst &f{item} &cnicht in Behältern verschieben.{reason}"
  hopper: "{prefix}&cTrichter können &f{item} &cnicht verschieben.{reason}"
  smithing: "{prefix}&cDu kannst &f{item} &cnicht am Schmiedetisch herstellen.{reason}"
  enchanted-item: "{prefix}&f{item} &chat die blockierte Verzauberung &f{enchantment} {level}&c.{reason}"
  enchanting: "{prefix}&cDu kannst nicht mit &f{enchantment} {level} &cverzaubern.{reason}"
  stack-limit: "{prefix}&f{item} &cstapelt sich hier höchstens bis &f{limit}&c.{reason}"
  inventory-limit: "{prefix}&cDu kannst höchstens &f{limit} {item} &ctragen.{reason}"
  potion: "{prefix}&cDer Effekt &f{effect} {level} &cist blockiert.{reason}"
  reason: " &7({reason}&7)"

word:
  all-actions: "alle Aktionen"
  no-actions: "keine Aktionen"
  all-worlds: "alle Welten"
  all-regions: "alle Regionen"
  none: "keine"
  no-limit: "kein Limit"

error:
  no-permission: "{prefix}&cDazu hast du keine Berechtigung."
  players-only: "{prefix}&cDas können nur Spieler tun."
  unknown-command: "{prefix}&cUnbekannter Befehl. Nutze &f/{label} help&c."
  usage: "{prefix}&cVerwendung: &f/{label} {usage}"
  unknown-item: "{prefix}&cUnbekanntes Item: &f{input}&c."
  unknown-enchantment: "{prefix}&cUnbekannte Verzauberung: &f{input}&c."
  unknown-potion: "{prefix}&cUnbekannter Trankeffekt: &f{input}&c."
  unknown-action: "{prefix}&cUnbekannte Aktion: &f{input}&c. Verfügbar: &f{actions}&c."
  unknown-option: "{prefix}&cUnbekannte Option: &f{input}&c."
  invalid-level: "{prefix}&cDie Stufe muss eine ganze Zahl ab 1 sein, nicht &f{input}&c."
  invalid-limit: "{prefix}&cEin Limit muss eine ganze Zahl ab 1 oder none sein, erhalten: &f{input}&c."
  invalid-model: "{prefix}&cCustom Model Data muss eine ganze Zahl sein, erhalten: &f{input}&c."
  empty-hand: "{prefix}&cHalte ein Item in deiner Haupthand."
  unknown-preset: "{prefix}&cDas Preset &f{preset} &cexistiert nicht."
  save-failed: "{prefix}&cDie Regeln konnten nicht gespeichert werden: &f{error}"
  reload-failed: "{prefix}&cNeuladen fehlgeschlagen: &f{error}&c. Die bisherigen Regeln bleiben aktiv."

item:
  blocked: "{prefix}&f{item} &aist in &e{preset} &ablockiert: &f{actions} &7(Welten: &f{worlds}&7)&a."
  updated: "{prefix}&f{item} &awurde in &e{preset} &ageändert: &f{actions} &7(Welten: &f{worlds}&7)&a."
  unblocked: "{prefix}&f{item} &aist in &e{preset} &anicht mehr blockiert."
  not-blocked: "{prefix}&f{item} &7ist in &e{preset} &7nicht blockiert."

limit:
  set: "{prefix}&aLimits für &f{item} &ain &e{preset}&a: Stapel &f{stack}&a, Inventar &f{inventory}&a."
  removed: "{prefix}&aLimits für &f{item} &ain &e{preset} &aentfernt."

filter:
  saved: "{prefix}&aFilter &e{filter} &ain &e{preset} &agespeichert: &f{match}&a, blockiert &f{actions} &7in &f{worlds}&a."
  removed: "{prefix}&aFilter &e{filter} &aaus &e{preset} &aentfernt."
  unknown: "{prefix}&cPreset &e{preset} &chat keinen Filter &f{filter}&c."
  invalid-id: "{prefix}&cUngültige Filter-ID &f{filter}&c. Nutze 1-32 Zeichen: a-z, 0-9, _ oder -."
  empty: "{prefix}&cEin Filter braucht mindestens eines von hand, type:, name:, lore:, model:, data: oder enchantment:."

enchantment:
  blocked: "{prefix}&f{enchantment} &aist ab Stufe &f{level} &ain &e{preset} &ablockiert."
  unblocked: "{prefix}&f{enchantment} &aist in &e{preset} &anicht mehr blockiert."
  not-blocked: "{prefix}&f{enchantment} &7ist in &e{preset} &7nicht blockiert."

potion:
  blocked: "{prefix}&f{effect} &aist ab Stufe &f{level} &ain &e{preset} &ablockiert."
  unblocked: "{prefix}&f{effect} &aist in &e{preset} &anicht mehr blockiert."
  not-blocked: "{prefix}&f{effect} &7ist in &e{preset} &7nicht blockiert."

preset:
  created: "{prefix}&aPreset &e{preset} &awurde erstellt."
  deleted: "{prefix}&aPreset &e{preset} &awurde gelöscht."
  exists: "{prefix}&cPreset &e{preset} &cexistiert bereits."
  invalid-name: "{prefix}&cUngültiger Preset-Name &f{preset}&c. Nutze 1-32 Zeichen: a-z, 0-9, _ oder -."
  default-protected: "{prefix}&cDas Preset default kann nicht gelöscht werden."
  description-set: "{prefix}&aDie Beschreibung von &e{preset} &awurde geändert."
  reason-set: "{prefix}&aDer Grund von &e{preset} &awurde geändert."
  worlds-set: "{prefix}&aPreset &e{preset} &agilt jetzt für: &f{worlds}&a."
  regions-set: "{prefix}&aRegionen von &e{preset}&a: &f{regions}&a."
  regions-unavailable: "{prefix}&eWorldGuard ist nicht installiert, daher gilt dieses Preset nirgends, bis es installiert ist."

