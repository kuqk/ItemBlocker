  entry-lore: "&7Bloqué: &f{actions}\n&7Mondes: &f{worlds}\n&7Limite de pile: &f{stack}\n&7Limite d'inventaire: &f{inventory}\n\n&eClique pour modifier\n&eShift + clic droit pour supprimer"
  item-lore: "&7Bloqué: &f{actions}\n&7Mondes: &f{worlds}\n&7Limite de pile: &f{stack}\n&7Limite d'inventaire: &f{inventory}"
  action-name: "&f{action}"
  action-blocked: "&cBloqué\n&eClique pour autoriser"
