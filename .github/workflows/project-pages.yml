name: Project pages

# Keeps the Modrinth and Hangar project pages in sync with README.md, and the Modrinth summary in
# sync with the plugin.yml description. Each platform is skipped when its repository variable is
# not set.

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - src/main/resources/plugin.yml
      - .github/workflows/project-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modrinth:
    name: Modrinth
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          SUMMARY="$(sed -nE 's/^description:[[:space:]]*"?([^"]*)"?$/\1/p' src/main/resources/plugin.yml)"
          jq -n --rawfile body README.md --arg description "${SUMMARY}" '{body: $body, description: $description}' > project.json
          curl --fail-with-body --silent --show-error -X PATCH "https://api.modrinth.com/v2/project/${PROJECT}" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @project.json

  hangar:
    name: Hangar
    if: vars.HANGAR_SLUG != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update main page
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          SLUG: ${{ vars.HANGAR_SLUG }}
        run: |
          TOKEN="$(curl --fail --silent --show-error -X POST -G \
            --data-urlencode "apiKey=${HANGAR_API_TOKEN}" \
            "https://hangar.papermc.io/api/v1/authenticate" | jq -r '.token // empty')"
          if [ -z "${TOKEN}" ]; then
            echo "::error::Hangar authentication failed. Check the HANGAR_API_TOKEN secret."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"

          jq -n --rawfile content README.md '{content: $content}' > page.json
          curl --fail-with-body --silent --show-error -X PATCH "https://hangar.papermc.io/api/v1/pages/editmain/${SLUG}" \
            -H "Authorization: ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data @page.json
