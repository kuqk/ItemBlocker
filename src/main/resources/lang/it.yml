# Messaggi di ItemBlocker (italiano)
# Colori: &a, &c, ... e colori hex come &#ff8800. I segnaposto si scrivono come {nome}.
# Le voci mancanti usano il testo incluso, quindi basta tenere solo quelle che modifichi.

prefix: "&8[&5ItemBlocker&8]&r "

restriction:
  crafting: "{prefix}&cNon puoi creare &f{item}&c.{reason}"
  pickup: "{prefix}&cNon puoi raccogliere &f{item}&c.{reason}"
  drop: "{prefix}&cNon puoi gettare &f{item}&c.{reason}"
  use: "{prefix}&cNon puoi usare &f{item}&c.{reason}"
  place: "{prefix}&cNon puoi piazzare &f{item}&c.{reason}"
  armor: "{prefix}&cNon puoi indossare &f{item}&c.{reason}"
  inventory: "{prefix}&cNon puoi spostare &f{item}&c nei contenitori.{reason}"
  hopper: "{prefix}&cLe tramogge non possono spostare &f{item}&c.{reason}"
  smithing: "{prefix}&cNon puoi forgiare &f{item}&c al tavolo da fabbro.{reason}"
  enchanted-item: "{prefix}&f{item} &cha l'incantesimo bloccato &f{enchantment} {level}&c.{reason}"
  enchanting: "{prefix}&cNon puoi incantare con &f{enchantment} {level}&c.{reason}"
  stack-limit: "{prefix}&f{item} &csi impila qui fino a &f{limit}&c.{reason}"
  inventory-limit: "{prefix}&cPuoi portare al massimo &f{limit} {item}&c.{reason}"
  potion: "{prefix}&cL'effetto &f{effect} {level} &cè bloccato.{reason}"
  reason: " &7({reason}&7)"

word:
  all-actions: "tutte le azioni"
  no-actions: "nessuna azione"
  all-worlds: "tutti i mondi"
  all-regions: "tutte le regioni"
  none: "nessuno"
  no-limit: "nessun limite"

error:
  no-permission: "{prefix}&cNon hai il permesso di farlo."
  players-only: "{prefix}&cSolo i giocatori possono farlo."
  unknown-command: "{prefix}&cComando sconosciuto. Usa &f/{label} help&c."
  usage: "{prefix}&cUso: &f/{label} {usage}"
  unknown-item: "{prefix}&cOggetto sconosciuto: &f{input}&c."
  unknown-world: "{prefix}&cMondo sconosciuto: &f{input}&c."
  unknown-enchantment: "{prefix}&cIncantesimo sconosciuto: &f{input}&c."
  unknown-potion: "{prefix}&cEffetto di pozione sconosciuto: &f{input}&c."
  unknown-action: "{prefix}&cAzione sconosciuta: &f{input}&c. Disponibili: &f{actions}&c."
  unknown-option: "{prefix}&cOpzione sconosciuta: &f{input}&c."
  invalid-level: "{prefix}&cIl livello deve essere un numero intero da 1, non &f{input}&c."
  invalid-limit: "{prefix}&cUn limite deve essere un numero intero da 1 o none, ricevuto &f{input}&c."
  invalid-model: "{prefix}&cIl custom model data deve essere un numero intero, ricevuto &f{input}&c."
  empty-hand: "{prefix}&cTieni un oggetto nella mano principale."
  unknown-preset: "{prefix}&cIl preset &f{preset} &cnon esiste."
  save-failed: "{prefix}&cImpossibile salvare le regole: &f{error}"
  reload-failed: "{prefix}&cImpossibile ricaricare: &f{error}&c. Le regole precedenti restano attive."

item:
  blocked: "{prefix}&f{item} &aè bloccato in &e{preset}&a: &f{actions} &7in &f{worlds}&a."
  updated: "{prefix}&f{item} &aè stato aggiornato in &e{preset}&a: &f{actions} &7in &f{worlds}&a."
  unblocked: "{prefix}&f{item} &anon è più bloccato in &e{preset}&a."
  not-blocked: "{prefix}&f{item} &7non è bloccato in &e{preset}&7."

limit:
  set: "{prefix}&aLimiti di &f{item} &ain &e{preset}&a: pila &f{stack}&a, inventario &f{inventory}&a."
  removed: "{prefix}&aRimossi i limiti di &f{item} &ain &e{preset}&a."

filter:
  saved: "{prefix}&aFiltro &e{filter} &asalvato in &e{preset}&a: &f{match}&a, blocca &f{actions} &7in &f{worlds}&a."
  removed: "{prefix}&aFiltro &e{filter} &arimosso da &e{preset}&a."
  unknown: "{prefix}&cIl preset &e{preset} &cnon ha il filtro &f{filter}&c."
  invalid-id: "{prefix}&cID filtro non valido &f{filter}&c. Usa 1-32 caratteri: a-z, 0-9, _ o -."
  empty: "{prefix}&cUn filtro richiede almeno uno tra hand, type:, name:, lore:, model:, data: o enchantment:."

group:
  saved: "{prefix}&aGruppo &e{group} &asalvato in &e{preset}&a: blocca &f{actions} &7in &f{worlds}&a."
  removed: "{prefix}&aGruppo &e{group} &arimosso da &e{preset}&a."
  unknown: "{prefix}&cIl preset &e{preset} &cnon ha il gruppo &f{group}&c."
  invalid: "{prefix}&cSchema non valido &f{group}&c. Usa * come jolly, come *_sword, o un tag come #swords."

allow:
  added: "{prefix}&f{item} &aè consentito in &e{preset}&a."
  removed: "{prefix}&f{item} &anon è più consentito in &e{preset}&a."
  unknown: "{prefix}&f{item} &cnon è nella lista consentita di &e{preset}&c."

scan:
  started: "{prefix}&7Scansione di {target}..."
  header: "&6Oggetti vietati in {target}&7: &f{count}"
  entry: " &8• &f{holder}&7: &f{amount}x {item} &8({preset})"
  more: " &7... e altri &f{more}"
  none: "{prefix}&aNessun oggetto vietato trovato in {target}."
  hint: "&7Aggiungi &fremove &7o &fconfiscate &7al comando per toglierli."
  removed: "{prefix}&aRimosse &f{count} &apile vietate da {target}."
  confiscated: "{prefix}&aConfiscate &f{count} &apile vietate da {target}. Vedi &f/{label} confiscated&a."
  unsupported: "{prefix}&cQuesto server non permette di scansionare i contenitori nei chunk caricati."

confiscated:
  header: "&6Oggetti confiscati"
  entry: " &8• &f{owner}&7: &f{count} &7pile"
  empty: " &7Niente confiscato."
  given: "{prefix}&aHai ricevuto &f{count} &apile confiscate a &f{owner}&a."
  unknown: "{prefix}&cNon è stato confiscato niente a &f{owner}&c."

log:
  header: "&6Azioni bloccate di recente"
  entry: " &8• &7{time} &f{player} &7{action} &f{item} &8({world}, {preset})"
  empty: " &7Ancora niente registrato."

enchantment:
  blocked: "{prefix}&f{enchantment} &aè bloccato dal livello &f{level} &ain &e{preset}&a."
  unblocked: "{prefix}&f{enchantment} &anon è più bloccato in &e{preset}&a."
  not-blocked: "{prefix}&f{enchantment} &7non è bloccato in &e{preset}&7."

potion:
  blocked: "{prefix}&f{effect} &aè bloccato dal livello &f{level} &ain &e{preset}&a."
  unblocked: "{prefix}&f{effect} &anon è più bloccato in &e{preset}&a."
  not-blocked: "{prefix}&f{effect} &7non è bloccato in &e{preset}&7."

preset:
  created: "{prefix}&aCreato il preset &e{preset}&a."
  deleted: "{prefix}&aEliminato il preset &e{preset}&a."
  exists: "{prefix}&cIl preset &e{preset} &cesiste già."
  invalid-name: "{prefix}&cNome del preset non valido: &f{preset}&c. Usa da 1 a 32 caratteri: a-z, 0-9, _ o -."
  default-protected: "{prefix}&cIl preset default non può essere eliminato."
  description-set: "{prefix}&aDescrizione di &e{preset} &aaggiornata."
  reason-set: "{prefix}&aMotivo di &e{preset} &aaggiornato."
  worlds-set: "{prefix}&aIl preset &e{preset} &aora vale in &f{worlds}&a."
  regions-set: "{prefix}&aRegioni di &e{preset}&a: &f{regions}&a."
  regions-unavailable: "{prefix}&eWorldGuard non è installato, quindi questo preset non vale da nessuna parte finché non lo sarà."

show:
  item-header: "&6{item} &8- &7regole"
  item-entry: " &8• &e{preset}&7: &f{actions} &7in &f{worlds}"
  item-empty: " &7Nessun preset blocca &f{item}&7."
  limit-entry: " &8• &e{preset}&7: pila &f{stack}&7, inventario &f{inventory}"
  filter-entry: " &8• &e{preset}&7: filtro &e{filter}&7, &f{actions} &7in &f{worlds}"
  enchantment-header: "&6{enchantment} &8- &7regole"
  potion-header: "&6{effect} &8- &7regole"
  level-entry: " &8• &e{preset}&7: dal livello &f{level} &7in &f{worlds}"
  level-empty: " &7Nessun preset lo blocca."

list:
  header: "&6Regole di ItemBlocker"
  preset-entry: " &8• &e{preset}&7: &f{items} &7oggetti, &f{enchantments} &7incantesimi, &f{potions} &7effetti di pozione &8(&7{worlds}&8)"
  items-header: "&6Oggetti bloccati in &e{preset}"
  item-entry: " &8• &f{item}&7: &f{actions} &7in &f{worlds}"
  limits-header: "&6Limiti degli oggetti in &e{preset}"
  limit-entry: " &8• &f{item}&7: pila &f{stack}&7, inventario &f{inventory}"
  filters-header: "&6Filtri degli oggetti in &e{preset}"
  filter-entry: " &8• &e{filter}&7: &f{match} &8- &f{actions} &7in &f{worlds}"
  groups-header: "&6Gruppi di oggetti in &e{preset}"
  group-entry: " &8• &e{group}&7: &f{actions} &7in &f{worlds}"
  allowed-header: "&6Oggetti consentiti in &e{preset}"
  allowed-entry: " &8• &f{item}"
  enchantments-header: "&6Incantesimi bloccati in &e{preset}"
  potions-header: "&6Effetti di pozione bloccati in &e{preset}"
  level-entry: " &8• &f{name}&7: dal livello &f{level}"
  empty: " &7Non c'è niente qui."

presets:
  header: "&6Preset"
  entry: " &8• &e{preset}&7: {description}"
  no-description: "&8nessuna descrizione"
  details-header: "&6Preset &e{preset}"
  details-description: " &7Descrizione: &f{description}"
  details-reason: " &7Motivo: &f{reason}"
  details-worlds: " &7Mondi: &f{worlds}"
  details-regions: " &7Regioni: &f{regions}"
  details-counts: " &7Regole: &f{items} &7oggetti, &f{enchantments} &7incantesimi, &f{potions} &7effetti di pozione"

reloaded: "{prefix}&aConfigurazione, regole e messaggi ricaricati."

gui:
  presets-title: "Preset di ItemBlocker"
  preset-title: "Preset {preset}"
  item-title: "{item} in {preset}"
  preset-name: "&e{preset}"
  preset-lore: "&7{description}\n&7Mondi: &f{worlds}\n&7Regioni: &f{regions}\n&7Oggetti: &f{items}&7, limiti: &f{limits}\n&7Incantesimi: &f{enchantments}&7, effetti: &f{potions}\n\n&eClicca per aprire"
  entry-lore: "&7Bloccato: &f{actions}\n&7Mondi: &f{worlds}\n&7Limite pila: &f{stack}\n&7Limite inventario: &f{inventory}\n\n&eClicca per modificare\n&eShift + clic destro per rimuovere"
  item-lore: "&7Bloccato: &f{actions}\n&7Mondi: &f{worlds}\n&7Limite pila: &f{stack}\n&7Limite inventario: &f{inventory}"
  action-name: "&f{action}"
  action-blocked: "&cBloccato\n&eClicca per consentire"
  action-allowed: "&aConsentito\n&eClicca per bloccare"
  stack-name: "&eLimite pila: &f{limit}"
  inventory-name: "&eLimite inventario: &f{limit}"
  limit-lore: "&7Clic sinistro: +1, clic destro: -1\n&7Con Shift: +16 / -16\n&7A 0 non c'è limite"
  worlds-name: "&eMondi: &f{worlds}"
  worlds-lore: "&7Cambia con\n&f/ib edit {item_key} worlds:..."
  remove-name: "&cRimuovi"
  remove-lore: "&7Rimuove la regola e i limiti\n&7di questo oggetto dal preset."
  add-name: "&aAggiungi un oggetto"
  add-lore: "&7Clicca un oggetto nel tuo inventario\n&7per bloccarlo o limitarlo."
  back: "&eIndietro"
  close: "&cChiudi"
  previous: "&ePagina precedente"
  next: "&ePagina successiva"

