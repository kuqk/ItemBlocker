name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin
        run: bash ./mvnw -B -ntp clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: ItemBlocker-${{ github.sha }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error

  api-compatibility:
    name: API link check (Paper ${{ matrix.paper }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.21.1-R0.1-SNAPSHOT
          - 1.21.4-R0.1-SNAPSHOT
          - 1.21.11-R0.1-SNAPSHOT
          - 26.1.2.build.74-stable
          - 26.2.build.134-stable
          - 26.3.build.205-stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile plugin
        run: bash ./mvnw -B -ntp compile

      - name: Resolve Paper API classpath
        run: >-
          bash ./mvnw -B -ntp -q -f .github/compat/pom.xml dependency:build-classpath
          -Dpaper.version=${{ matrix.paper }}
          -Dmdep.includeScope=runtime
          -Dmdep.outputFile="${RUNNER_TEMP}/paper-classpath.txt"

      - name: Check that every API reference links
        run: java .github/compat/ApiLinkCheck.java target/classes "${RUNNER_TEMP}/paper-classpath.txt" pl/variant/
