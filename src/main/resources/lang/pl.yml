  presets-title: "Presety ItemBlocker"
  preset-title: "Preset {preset}"
  item-title: "{item} w {preset}"
  preset-name: "&e{preset}"
  preset-lore: "&7{description}\n&7Światy: &f{worlds}\n&7Regiony: &f{regions}\n&7Przedmioty: &f{items}&7, limity: &f{limits}\n&7Enchanty: &f{enchantments}&7, efekty: &f{potions}\n\n&eKliknij, aby otworzyć"
  entry-lore: "&7Zablokowane: &f{actions}\n&7Światy: &f{worlds}\n&7Limit stacka: &f{stack}\n&7Limit w ekwipunku: &f{inventory}\n\n&eKliknij, aby edytować\n&eShift + prawy przycisk, aby usunąć"
  item-lore: "&7Zablokowane: &f{actions}\n&7Światy: &f{worlds}\n&7Limit stacka: &f{stack}\n&7Limit w ekwipunku: &f{inventory}"
  action-name: "&f{action}"
  action-blocked: "&cZablokowane\n&eKliknij, aby odblokować"
  action-allowed: "&aDozwolone\n&eKliknij, aby zablokować"
  stack-name: "&eLimit stacka: &f{limit}"
  inventory-name: "&eLimit w ekwipunku: &f{limit}"
  limit-lore: "&7Lewy przycisk: +1, prawy: -1\n&7Z Shiftem: +16 / -16\n&70 oznacza brak limitu"
  worlds-name: "&eŚwiaty: &f{worlds}"
  worlds-lore: "&7Zmień komendą\n&f/ib edit {item_key} worlds:..."
  remove-name: "&cUsuń"
  remove-lore: "&7Usuwa regułę i limity\n&7tego przedmiotu z presetu."
  add-name: "&aDodaj przedmiot"
  add-lore: "&7Kliknij przedmiot w swoim ekwipunku,\n&7aby go zablokować lub ograniczyć."
  back: "&eWstecz"
  close: "&cZamknij"
  previous: "&ePoprzednia strona"
  next: "&eNastępna strona"

