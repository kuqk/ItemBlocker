# ItemBlocker configuration
# Restrictions themselves live in rules.yml.

config-version: 2

# Language of plugin messages: en, pl, de, es, fr, it
# Message files are in the lang folder and can be edited freely.
language: en

messages:
  # Minimum time between two restriction messages to the same player, in milliseconds.
  cooldown-ms: 1000

bypass:
  # Players with itemblocker.bypass ignore every restriction.
  enabled: true
  # Players with itemblocker.bypass.<action> ignore restrictions for that action, for example
  # itemblocker.bypass.place. Actions: crafting, pickup, drop, use, place, armor, inventory,
  # hopper, smithing, attack, break, trade, enchantment, potion, limit.
  per-action: true

log:
  # Write every blocked action to logs/<date>.log: time, player, action, item, world and preset.
  # /ib log shows the most recent ones.
  enabled: true
  discord:
    # Discord webhook that gets an alert for every blocked action. Leave empty to turn it off.
    webhook: ""
    # Minimum time between two alerts about the same player, action and item, in seconds.
    cooldown-seconds: 60
