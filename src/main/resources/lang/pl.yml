  enchanting: "{prefix}&cNie możesz zaklinać na &f{enchantment} {level}&c.{reason}"
  enchantment-downgraded: "{prefix}&f{item}&e: &f{enchantment} &eobniżono do poziomu &f{level}&e.{reason}"
