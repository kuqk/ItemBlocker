  level-lore: "&7Blocked from level: &f{level}\n\n&7Left click: +1, right click: -1\n&7Shift + right click: unblock"
  not-blocked: "not blocked"
  bypass-name: "&eBypass permission: &f{permission}"
  change-lore: "&eClick to change"
  clear-lore: "&eClick to change\n&7Type none to clear"
  criterion-name: "&e{criterion}: &f{value}"
