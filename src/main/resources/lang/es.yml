show:
  item-header: "&6{item} &8- &7reglas"
  item-entry: " &8• &e{preset}&7: &f{actions} &7en &f{worlds}"
  item-empty: " &7Ningún preset bloquea &f{item}&7."
  limit-entry: " &8• &e{preset}&7: pila &f{stack}&7, inventario &f{inventory}"
