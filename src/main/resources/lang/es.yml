# Mensajes de ItemBlocker (español)
# Colores: &a, &c, ... y colores hex como &#ff8800. Los marcadores se escriben como {nombre}.
# Las entradas que falten usan el texto incluido, así que solo necesitas conservar las que cambies.

prefix: "&8[&5ItemBlocker&8]&r "

restriction:
  crafting: "{prefix}&cNo puedes fabricar &f{item}&c.{reason}"
  pickup: "{prefix}&cNo puedes recoger &f{item}&c.{reason}"
  drop: "{prefix}&cNo puedes soltar &f{item}&c.{reason}"
  use: "{prefix}&cNo puedes usar &f{item}&c.{reason}"
  place: "{prefix}&cNo puedes colocar &f{item}&c.{reason}"
  armor: "{prefix}&cNo puedes equiparte &f{item}&c.{reason}"
  inventory: "{prefix}&cNo puedes mover &f{item}&c en contenedores.{reason}"
  hopper: "{prefix}&cLas tolvas no pueden mover &f{item}&c.{reason}"
  smithing: "{prefix}&cNo puedes forjar &f{item}&c en la mesa de herrería.{reason}"
  attack: "{prefix}&cNo puedes atacar con &f{item}&c.{reason}"
  break: "{prefix}&cNo puedes romper &f{item}&c.{reason}"
  break-with: "{prefix}&cNo puedes romper bloques con &f{item}&c.{reason}"
  crafter: "{prefix}&cLos crafters no pueden fabricar &f{item}&c.{reason}"
  dispense: "{prefix}&cLos dispensadores no pueden usar &f{item}&c.{reason}"
  brew: "{prefix}&cNo puedes preparar &f{item}&c.{reason}"
  trade: "{prefix}&cNo puedes comerciar por &f{item}&c.{reason}"
  loot: "{prefix}&f{item} &cno aparece en el botín.{reason}"
  entity_drop: "{prefix}&cLos mobs no sueltan &f{item}&c.{reason}"
  enchanted-item: "{prefix}&f{item} &ctiene el encantamiento bloqueado &f{enchantment} {level}&c.{reason}"
  enchanting: "{prefix}&cNo puedes encantar con &f{enchantment} {level}&c.{reason}"
  enchantment-downgraded: "{prefix}&f{item}&e: &f{enchantment} &ebajó al nivel &f{level}&e.{reason}"
  enchantment-removed: "{prefix}&f{item}&e: &ese quitó &f{enchantment}&e.{reason}"
  enchantment-confiscated: "{prefix}&cSe quitó &f{item} &cpor &f{enchantment}&c.{reason}"
  stack-limit: "{prefix}&f{item} &cse apila como máximo hasta &f{limit} &caquí.{reason}"
  inventory-limit: "{prefix}&cPuedes llevar como máximo &f{limit} {item}&c.{reason}"
  potion: "{prefix}&cEl efecto &f{effect} {level} &cestá bloqueado.{reason}"
  reason: " &7({reason}&7)"

word:
  all-actions: "todas las acciones"
  no-actions: "ninguna acción"
  all-worlds: "todos los mundos"
  all-regions: "todas las regiones"
  none: "ninguno"
  no-limit: "sin límite"
  mode-block: "bloqueado"
  mode-downgrade: "rebajado"
  mode-remove: "quitado"
  mode-confiscate: "confiscado"

error:
  no-permission: "{prefix}&cNo tienes permiso para hacer eso."
  players-only: "{prefix}&cSolo los jugadores pueden hacer eso."
  unknown-command: "{prefix}&cComando desconocido. Usa &f/{label} help&c."
  usage: "{prefix}&cUso: &f/{label} {usage}"
  unknown-item: "{prefix}&cÍtem desconocido: &f{input}&c."
  unknown-world: "{prefix}&cMundo desconocido: &f{input}&c."
  unknown-enchantment: "{prefix}&cEncantamiento desconocido: &f{input}&c."
  unknown-mode: "{prefix}&cModo desconocido: &f{input}&c. Disponibles: &fblock, downgrade, remove, confiscate&c."
  unknown-potion: "{prefix}&cEfecto de poción desconocido: &f{input}&c."
  unknown-action: "{prefix}&cAcción desconocida: &f{input}&c. Disponibles: &f{actions}&c."
  unknown-option: "{prefix}&cOpción desconocida: &f{input}&c."
  invalid-level: "{prefix}&cEl nivel debe ser un número entero desde 1, no &f{input}&c."
  invalid-limit: "{prefix}&cUn límite debe ser un número entero desde 1 o none, se recibió &f{input}&c."
  invalid-model: "{prefix}&cCustom model data debe ser un número entero, se recibió &f{input}&c."
  empty-hand: "{prefix}&cSostén un ítem en tu mano principal."
  unknown-preset: "{prefix}&cEl preset &f{preset} &cno existe."
  save-failed: "{prefix}&cNo se pudieron guardar las reglas: &f{error}"
  reload-failed: "{prefix}&cNo se pudo recargar: &f{error}&c. Las reglas anteriores siguen activas."

item:
  blocked: "{prefix}&aSe bloqueó &f{item} &aen &e{preset}&a: &f{actions} &7en &f{worlds}&a."
  updated: "{prefix}&aSe actualizó &f{item} &aen &e{preset}&a: &f{actions} &7en &f{worlds}&a."
  unblocked: "{prefix}&aSe desbloqueó &f{item} &aen &e{preset}&a."
  not-blocked: "{prefix}&f{item} &7no está bloqueado en &e{preset}&7."

limit:
  set: "{prefix}&aLímites de &f{item} &aen &e{preset}&a: pila &f{stack}&a, inventario &f{inventory}&a."
  removed: "{prefix}&aSe quitaron los límites de &f{item} &aen &e{preset}&a."

filter:
  saved: "{prefix}&aFiltro &e{filter} &aguardado en &e{preset}&a: &f{match}&a, bloquea &f{actions} &7en &f{worlds}&a."
  removed: "{prefix}&aFiltro &e{filter} &aquitado de &e{preset}&a."
  unknown: "{prefix}&cEl preset &e{preset} &cno tiene el filtro &f{filter}&c."
  invalid-id: "{prefix}&cID de filtro no válido &f{filter}&c. Usa 1-32 caracteres: a-z, 0-9, _ o -."
  empty: "{prefix}&cUn filtro necesita al menos uno de hand, type:, name:, lore:, model:, data: o enchantment:."

group:
  saved: "{prefix}&aGrupo &e{group} &aguardado en &e{preset}&a: bloquea &f{actions} &7en &f{worlds}&a."
  removed: "{prefix}&aGrupo &e{group} &aquitado de &e{preset}&a."
  unknown: "{prefix}&cEl preset &e{preset} &cno tiene el grupo &f{group}&c."
  invalid: "{prefix}&cPatrón no válido &f{group}&c. Usa * como comodín, como *_sword, o una etiqueta como #swords."

allow:
  added: "{prefix}&f{item} &apermitido en &e{preset}&a."
  removed: "{prefix}&f{item} &aya no está permitido en &e{preset}&a."
  unknown: "{prefix}&f{item} &cno está en la lista de permitidos de &e{preset}&c."

scan:
  started: "{prefix}&7Escaneando {target}..."
  header: "&6Objetos prohibidos en {target}&7: &f{count}"
  entry: " &8• &f{holder}&7: &f{amount}x {item} &8({preset})"
  more: " &7... y &f{more} &7más"
  none: "{prefix}&aNo se encontraron objetos prohibidos en {target}."
  hint: "&7Añade &fremove &7o &fconfiscate &7al comando para quitarlos."
  removed: "{prefix}&aSe quitaron &f{count} &apilas prohibidas de {target}."
  confiscated: "{prefix}&aSe confiscaron &f{count} &apilas prohibidas de {target}. Mira &f/{label} confiscated&a."
  unsupported: "{prefix}&cEste servidor no permite escanear contenedores en chunks cargados."

confiscated:
  header: "&6Objetos confiscados"
  entry: " &8• &f{owner}&7: &f{count} &7pilas"
  empty: " &7Nada confiscado."
  given: "{prefix}&aRecibiste &f{count} &apilas confiscadas a &f{owner}&a."
  unknown: "{prefix}&cNo se confiscó nada a &f{owner}&c."

log:
  header: "&6Acciones bloqueadas recientes"
  entry: " &8• &7{time} &f{player} &7{action} &f{item} &8({world}, {preset})"
  empty: " &7Aún no hay registros."

template:
  created: "{prefix}&aPreset &e{preset} &acreado desde la plantilla &e{template}&a."
  unknown: "{prefix}&cPlantilla desconocida: &f{input}&c. Disponibles: &f{templates}&c."
  header: "&6Plantillas de presets"
  entry: " &8• &e{template}&7: {description}"

enchantment:
  blocked: "{prefix}&aSe bloqueó &f{enchantment} &adesde el nivel &f{level} &aen &e{preset}&a."
  unblocked: "{prefix}&aSe desbloqueó &f{enchantment} &aen &e{preset}&a."
  not-blocked: "{prefix}&f{enchantment} &7no está bloqueado en &e{preset}&7."

potion:
  blocked: "{prefix}&aSe bloqueó &f{effect} &adesde el nivel &f{level} &aen &e{preset}&a."
  unblocked: "{prefix}&aSe desbloqueó &f{effect} &aen &e{preset}&a."
  not-blocked: "{prefix}&f{effect} &7no está bloqueado en &e{preset}&7."

preset:
  created: "{prefix}&aSe creó el preset &e{preset}&a."
  deleted: "{prefix}&aSe eliminó el preset &e{preset}&a."
  exists: "{prefix}&cEl preset &e{preset} &cya existe."
  invalid-name: "{prefix}&cNombre de preset no válido: &f{preset}&c. Usa de 1 a 32 caracteres: a-z, 0-9, _ o -."
  default-protected: "{prefix}&cEl preset default no se puede eliminar."
  description-set: "{prefix}&aSe actualizó la descripción de &e{preset}&a."
  reason-set: "{prefix}&aSe actualizó el motivo de &e{preset}&a."
  worlds-set: "{prefix}&aEl preset &e{preset} &aahora se aplica en &f{worlds}&a."
  regions-set: "{prefix}&aRegiones de &e{preset}&a: &f{regions}&a."
