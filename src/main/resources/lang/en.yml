# ItemBlocker messages (English)
# Colors: &a, &c, ... and hex colors like &#ff8800. Placeholders are written as {name}.
# Missing entries fall back to the bundled text, so you only need to keep the ones you change.

prefix: "&8[&5ItemBlocker&8]&r "

restriction:
  crafting: "{prefix}&cYou cannot craft &f{item}&c.{reason}"
  pickup: "{prefix}&cYou cannot pick up &f{item}&c.{reason}"
  drop: "{prefix}&cYou cannot drop &f{item}&c.{reason}"
  use: "{prefix}&cYou cannot use &f{item}&c.{reason}"
  place: "{prefix}&cYou cannot place &f{item}&c.{reason}"
  armor: "{prefix}&cYou cannot wear &f{item}&c.{reason}"
  inventory: "{prefix}&cYou cannot move &f{item}&c in containers.{reason}"
  hopper: "{prefix}&cHoppers cannot move &f{item}&c.{reason}"
  smithing: "{prefix}&cYou cannot smith &f{item}&c.{reason}"
  enchanted-item: "{prefix}&f{item} &chas &f{enchantment} {level}&c, which is blocked.{reason}"
  enchanting: "{prefix}&cYou cannot enchant with &f{enchantment} {level}&c.{reason}"
  stack-limit: "{prefix}&f{item} &cstacks up to &f{limit} &chere.{reason}"
  inventory-limit: "{prefix}&cYou can carry at most &f{limit} {item}&c.{reason}"
  potion: "{prefix}&cThe effect &f{effect} {level} &cis blocked.{reason}"
  reason: " &7({reason}&7)"

word:
  all-actions: "all actions"
  no-actions: "no actions"
  all-worlds: "all worlds"
  all-regions: "all regions"
  none: "none"
  no-limit: "no limit"

error:
  no-permission: "{prefix}&cYou do not have permission to do that."
  players-only: "{prefix}&cOnly players can do that."
  unknown-command: "{prefix}&cUnknown command. Use &f/{label} help&c."
  usage: "{prefix}&cUsage: &f/{label} {usage}"
  unknown-item: "{prefix}&cUnknown item: &f{input}&c."
  unknown-world: "{prefix}&cUnknown world: &f{input}&c."
  unknown-enchantment: "{prefix}&cUnknown enchantment: &f{input}&c."
  unknown-potion: "{prefix}&cUnknown potion effect: &f{input}&c."
  unknown-action: "{prefix}&cUnknown action: &f{input}&c. Available: &f{actions}&c."
  unknown-option: "{prefix}&cUnknown option: &f{input}&c."
  invalid-level: "{prefix}&cThe level must be a whole number from 1, got &f{input}&c."
  invalid-limit: "{prefix}&cA limit must be a whole number from 1 or none, got &f{input}&c."
  invalid-model: "{prefix}&cCustom model data must be a whole number, got &f{input}&c."
  empty-hand: "{prefix}&cHold an item in your main hand."
  unknown-preset: "{prefix}&cPreset &f{preset} &cdoes not exist."
  save-failed: "{prefix}&cCould not save the rules: &f{error}"
  reload-failed: "{prefix}&cCould not reload: &f{error}&c. The previous rules stay active."

item:
  blocked: "{prefix}&aBlocked &f{item} &ain &e{preset}&a: &f{actions} &7in &f{worlds}&a."
  updated: "{prefix}&aUpdated &f{item} &ain &e{preset}&a: &f{actions} &7in &f{worlds}&a."
  unblocked: "{prefix}&aUnblocked &f{item} &ain &e{preset}&a."
  not-blocked: "{prefix}&f{item} &7is not blocked in &e{preset}&7."

limit:
  set: "{prefix}&aLimits for &f{item} &ain &e{preset}&a: stack &f{stack}&a, inventory &f{inventory}&a."
  removed: "{prefix}&aRemoved the limits for &f{item} &ain &e{preset}&a."

filter:
  saved: "{prefix}&aSaved filter &e{filter} &ain &e{preset}&a: &f{match}&a, blocks &f{actions} &7in &f{worlds}&a."
  removed: "{prefix}&aRemoved filter &e{filter} &afrom &e{preset}&a."
  unknown: "{prefix}&cPreset &e{preset} &chas no filter &f{filter}&c."
  invalid-id: "{prefix}&cInvalid filter id &f{filter}&c. Use 1-32 characters: a-z, 0-9, _ or -."
  empty: "{prefix}&cA filter needs at least one of hand, type:, name:, lore:, model:, data: or enchantment:."

group:
  saved: "{prefix}&aSaved group &e{group} &ain &e{preset}&a: blocks &f{actions} &7in &f{worlds}&a."
  removed: "{prefix}&aRemoved group &e{group} &afrom &e{preset}&a."
  unknown: "{prefix}&cPreset &e{preset} &chas no group &f{group}&c."
  invalid: "{prefix}&cInvalid pattern &f{group}&c. Use * as a wildcard, such as *_sword, or a tag such as #swords."

allow:
  added: "{prefix}&aAllowed &f{item} &ain &e{preset}&a."
  removed: "{prefix}&f{item} &ais no longer allowed in &e{preset}&a."
  unknown: "{prefix}&f{item} &cis not on the allowed list of &e{preset}&c."

scan:
  started: "{prefix}&7Scanning {target}..."
  header: "&6Forbidden items in {target}&7: &f{count}"
  entry: " &8• &f{holder}&7: &f{amount}x {item} &8({preset})"
  more: " &7... and &f{more} &7more"
  none: "{prefix}&aNo forbidden items found in {target}."
  hint: "&7Add &fremove &7or &fconfiscate &7to the command to take them away."
  removed: "{prefix}&aRemoved &f{count} &aforbidden item stacks from {target}."
  confiscated: "{prefix}&aConfiscated &f{count} &aforbidden item stacks from {target}. See &f/{label} confiscated&a."
  unsupported: "{prefix}&cContainers can only be scanned in loaded chunks on the main thread, which this server does not have."

confiscated:
  header: "&6Confiscated items"
  entry: " &8• &f{owner}&7: &f{count} &7stacks"
  empty: " &7Nothing confiscated."
  given: "{prefix}&aGave you &f{count} &astacks confiscated from &f{owner}&a."
  unknown: "{prefix}&cNothing was confiscated from &f{owner}&c."

log:
  header: "&6Recent blocked actions"
  entry: " &8• &7{time} &f{player} &7{action} &f{item} &8({world}, {preset})"
  empty: " &7Nothing logged yet."

enchantment:
  blocked: "{prefix}&aBlocked &f{enchantment} &afrom level &f{level} &ain &e{preset}&a."
  unblocked: "{prefix}&aUnblocked &f{enchantment} &ain &e{preset}&a."
  not-blocked: "{prefix}&f{enchantment} &7is not blocked in &e{preset}&7."

potion:
  blocked: "{prefix}&aBlocked &f{effect} &afrom level &f{level} &ain &e{preset}&a."
  unblocked: "{prefix}&aUnblocked &f{effect} &ain &e{preset}&a."
  not-blocked: "{prefix}&f{effect} &7is not blocked in &e{preset}&7."

preset:
  created: "{prefix}&aCreated preset &e{preset}&a."
  deleted: "{prefix}&aDeleted preset &e{preset}&a."
  exists: "{prefix}&cPreset &e{preset} &calready exists."
  invalid-name: "{prefix}&cInvalid preset name &f{preset}&c. Use 1-32 characters: a-z, 0-9, _ or -."
  default-protected: "{prefix}&cThe default preset cannot be deleted."
  description-set: "{prefix}&aUpdated the description of &e{preset}&a."
  reason-set: "{prefix}&aUpdated the reason of &e{preset}&a."
  worlds-set: "{prefix}&aPreset &e{preset} &anow applies in &f{worlds}&a."
  regions-set: "{prefix}&aRegions of &e{preset}&a: &f{regions}&a."
  regions-unavailable: "{prefix}&eWorldGuard is not installed, so this preset does not apply anywhere until it is."

show:
  item-header: "&6{item} &8- &7rules"
  item-entry: " &8• &e{preset}&7: &f{actions} &7in &f{worlds}"
  item-empty: " &7No preset blocks &f{item}&7."
  limit-entry: " &8• &e{preset}&7: stack &f{stack}&7, inventory &f{inventory}"
  filter-entry: " &8• &e{preset}&7: filter &e{filter}&7, &f{actions} &7in &f{worlds}"
  enchantment-header: "&6{enchantment} &8- &7rules"
  potion-header: "&6{effect} &8- &7rules"
  level-entry: " &8• &e{preset}&7: from level &f{level} &7in &f{worlds}"
  level-empty: " &7No preset blocks it."

list:
  header: "&6ItemBlocker rules"
  preset-entry: " &8• &e{preset}&7: &f{items} &7items, &f{enchantments} &7enchantments, &f{potions} &7potion effects &8(&7{worlds}&8)"
  items-header: "&6Blocked items in &e{preset}"
  item-entry: " &8• &f{item}&7: &f{actions} &7in &f{worlds}"
  limits-header: "&6Item limits in &e{preset}"
  limit-entry: " &8• &f{item}&7: stack &f{stack}&7, inventory &f{inventory}"
  filters-header: "&6Item filters in &e{preset}"
  filter-entry: " &8• &e{filter}&7: &f{match} &8- &f{actions} &7in &f{worlds}"
  groups-header: "&6Item groups in &e{preset}"
  group-entry: " &8• &e{group}&7: &f{actions} &7in &f{worlds}"
  allowed-header: "&6Allowed items in &e{preset}"
  allowed-entry: " &8• &f{item}"
  enchantments-header: "&6Blocked enchantments in &e{preset}"
  potions-header: "&6Blocked potion effects in &e{preset}"
  level-entry: " &8• &f{name}&7: from level &f{level}"
  empty: " &7Nothing here."

presets:
  header: "&6Presets"
  entry: " &8• &e{preset}&7: {description}"
  no-description: "&8no description"
  details-header: "&6Preset &e{preset}"
  details-description: " &7Description: &f{description}"
  details-reason: " &7Reason: &f{reason}"
  details-worlds: " &7Worlds: &f{worlds}"
  details-regions: " &7Regions: &f{regions}"
  details-counts: " &7Rules: &f{items} &7items, &f{enchantments} &7enchantments, &f{potions} &7potion effects"

reloaded: "{prefix}&aReloaded the configuration, rules and messages."

gui:
  presets-title: "ItemBlocker presets"
  preset-title: "Preset {preset}"
  item-title: "{item} in {preset}"
  preset-name: "&e{preset}"
  preset-lore: "&7{description}\n&7Worlds: &f{worlds}\n&7Regions: &f{regions}\n&7Items: &f{items}&7, limits: &f{limits}\n&7Enchantments: &f{enchantments}&7, potion effects: &f{potions}\n\n&eClick to open"
  entry-lore: "&7Blocked: &f{actions}\n&7Worlds: &f{worlds}\n&7Stack limit: &f{stack}\n&7Inventory limit: &f{inventory}\n\n&eClick to edit\n&eShift + right click to remove"
  item-lore: "&7Blocked: &f{actions}\n&7Worlds: &f{worlds}\n&7Stack limit: &f{stack}\n&7Inventory limit: &f{inventory}"
  action-name: "&f{action}"
  action-blocked: "&cBlocked\n&eClick to allow"
  action-allowed: "&aAllowed\n&eClick to block"
  stack-name: "&eStack limit: &f{limit}"
  inventory-name: "&eInventory limit: &f{limit}"
  limit-lore: "&7Left click: +1, right click: -1\n&7Shift click: +16 / -16\n&7At 0 there is no limit"
  worlds-name: "&eWorlds: &f{worlds}"
